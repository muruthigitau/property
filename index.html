<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mytown Karen</title>
    <link rel="shortcut icon" type="image/x-icon" href="/images/favicon.png" />

    <!-- Meta Tags for SEO -->
    <meta
      name="description"
      content="Welcome to Mytown Mall, Karen — your one-stop destination where convenience meets community. Offering a unique blend of retail and community experiences with sustainability, scalability, and affordability."
    />
    <meta
      name="keywords"
      content="Mytown Mall, Karen, shopping center, community, convenience, retail, sustainability, scalable spaces, Kenya, affordable malls"
    />
    <meta
      name="author"
      content="Mwenda Thuranira, Chairman – Mytown Mall, Karen"
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph Tags for Social Media Optimization -->
    <meta property="og:title" content="Mytown Karen" />
    <meta
      property="og:description"
      content="Mytown Mall, Karen is your one-stop destination for convenience and community. We combine retail and community experiences with a focus on sustainability and affordability."
    />
    <meta property="og:image" content="https://mytown.co.ke/images/offer.png" />
    <!-- Replace with the correct image URL -->
    <meta property="og:url" content="https://mytown.co.ke/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mytown Mall, Karen" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mytown Karen" />
    <meta
      name="twitter:description"
      content="Visit Mytown Mall, Karen for a unique blend of retail and community experiences. A destination where convenience meets community, focusing on sustainability, scalability, and affordability."
    />
    <meta
      name="twitter:image"
      content="https://mytown.co.ke/images/offer.png"
    />
    <!-- Replace with the correct image URL -->
    <meta name="twitter:site" content="@MytownKaren" />
    <!-- Replace with your Twitter handle if applicable -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="/css/bootstrap.min.css" rel="stylesheet" media="screen" />
    <link href="/css/slicknav.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/swiper-bundle.min.css" />

    <link href="/css/animate.css" rel="stylesheet" />
